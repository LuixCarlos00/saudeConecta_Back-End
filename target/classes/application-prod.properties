# =============================================================================
# CONFIGURAÇÕES DE PRODUÇÃO — saudeConecta API
# As senhas e segredos devem ser definidos como variáveis de ambiente no servidor.
# Nunca commite este arquivo com valores reais preenchidos.
# =============================================================================

# -----------------------------------------------------------------------------
# BANCO DE DADOS
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------------------------------------------------------------
# LIQUIBASE
# -----------------------------------------------------------------------------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# -----------------------------------------------------------------------------
# SEGURANÇA — JWT
# Gere uma chave forte: openssl rand -base64 64
# -----------------------------------------------------------------------------
api.security.token.secret=${JWT_SECRET}


# -----------------------------------------------------------------------------
# E-MAIL
# -----------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.email.enabled=true

# -----------------------------------------------------------------------------
# SERVIDOR
# -----------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# -----------------------------------------------------------------------------
# LOGS — nível reduzido em produção
# -----------------------------------------------------------------------------
logging.level.root=WARN
logging.level.br.com.saudeConecta=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.liquibase=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %5p --- [%15.15t] %-40.40logger{39} : %m%n

spring.output.ansi.enabled=NEVER
spring.banner.location=classpath:banner.txt

# -----------------------------------------------------------------------------
# PIX ESTÁTICO (chave do recebedor)
# -----------------------------------------------------------------------------
pix.chave=${14776815664}
pix.nome=${PIX_NOME:LUIZ CARLOS DE OLIVEIRA}
pix.cidade=${PIX_CIDADE:PAINS}
