# Perfil local (dev). Segredos só por variável de ambiente; os padrões abaixo servem apenas para a máquina local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/office}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
# Fuso (Fase 5.5): a JVM roda em America/Sao_Paulo (Dockerfile + SaudeConectaApplication) e as entidades
# só usam tipos sem fuso (LocalDate/LocalDateTime/java.sql.Date) em colunas DATETIME/TIMESTAMP/DATE.
# Por isso hibernate.jdbc.time_zone fica DESLIGADO de propósito: com a JVM em SP ele não muda nada e,
# se a JVM divergir, passaria a deslocar a leitura das datas já gravadas (inclusive data de nascimento).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


server.error.include-stacktrace=never
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


# Chave fraca só para dev; em produção vem de JWT_SECRET (application-prod.properties)
api.security.token.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao}


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Configuração para desabilitar envio de email em desenvolvimento
app.email.enabled=true
# -----------------------------------------------------------------------------
# MERCADO PAGO (assinaturas recorrentes por cartão)
# Todos os valores vêm de variáveis de ambiente — nunca versione credenciais.
# Veja docs/MERCADO-PAGO.md para obter as credenciais de teste.
#
# ATENÇÃO: MP_BACK_URL precisa ser uma URL pública. O Mercado Pago recusa
# endereços localhost com "Invalid value for back_url" — em desenvolvimento use
# a URL do ngrok ou a do frontend publicado. Sem essa variável a integração
# fica inativa e as rotas de assinatura respondem 503.
# -----------------------------------------------------------------------------
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.back-url=${MP_BACK_URL:}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

logging.level.root=INFO
logging.level.br.com.saudeConecta=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.liquibase=INFO

# requestId/tenantId/userId vêm do MDC (CorrelationIdFilter, TenantFilter, FiltroAcesso).
# Classe.metodo:linha mostra onde cada linha foi escrita. Padrão das mensagens: docs/LOGGING.md
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p){highlight} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{requestId:-} t=%X{tenantId:-} u=%X{userId:-}]){magenta} %clr(%logger{0}.%M:%L){cyan} %clr(:){faint} %m%n

spring.output.ansi.enabled=ALWAYS

spring.banner.location=classpath:banner.txt

# IP real do cliente atrás do proxy reverso: o Tomcat (RemoteIpValve) lê X-Forwarded-For
# da direita para a esquerda e só confia em proxies internos (server.tomcat.remoteip.internal-proxies),
# evitando que o cliente forje o IP gravado como evidência de assinatura dos links públicos.
server.forward-headers-strategy=native

# Origens liberadas no CORS (lista separada por virgula), lida pelo bean unico em SecurityConfigurations
app.cors.allowed-origins=http://localhost:4200

# Timeouts das chamadas HTTP externas (Mercado Pago). Sem eles um MP travado prende a
# thread do scheduler e o row lock aberto pela régua/reconciliação indefinidamente.
app.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:5s}
app.http.read-timeout=${HTTP_READ_TIMEOUT:15s}

# Pool do @Scheduled: com 1 thread (padrão) um job travado impede todos os outros de rodar
spring.task.scheduling.pool.size=4
