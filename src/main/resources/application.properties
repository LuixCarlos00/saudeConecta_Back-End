# Banco de dados (use variaveis de ambiente ou .env local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saudeConecta}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


server.error.include-stacktrace=never
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


# JWT Secret - IMPORTANTE: defina uma chave forte via variavel de ambiente
# Gere com: openssl rand -base64 32
api.security.token.secret=${JWT_SECRET:chave-desenvolvimento-local-trocar-em-producao}


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Configuracao para desabilitar envio de email em desenvolvimento
app.email.enabled=${EMAIL_ENABLED:false}

# Configuracao Pix Estatico (chave do recebedor)
pix.chave=${PIX_CHAVE:}
pix.nome=${PIX_NOME:}
pix.cidade=${PIX_CIDADE:}

spring.cache.type=caffeine
spring.cache.cache-names=configuracoes-cards,configuracoes-graficos,usuarios-agrupados,perfil-usuario,mensageria-contagem,especialidades,planos,procedimentos-padrao,profissionais-org
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

logging.level.root=INFO
logging.level.br.com.saudeConecta=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.liquibase=INFO

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p){highlight} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

spring.output.ansi.enabled=ALWAYS

spring.banner.location=classpath:banner.txt
