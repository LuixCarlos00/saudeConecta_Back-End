# Banco H2 em memória para testes de integração
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Desabilitar Liquibase nos testes (schema gerado pelo JPA)
spring.liquibase.enabled=false

# JWT secret para testes
api.security.token.secret=test-secret-key-para-testes-integracao

# Desabilitar envio de email nos testes
app.email.enabled=false
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test

# Cache em memória simples para testes
spring.cache.type=simple

# Reduzir log nos testes
logging.level.root=WARN
logging.level.br.com.saudeConecta=INFO
logging.level.org.springframework.security=WARN
